name: CI/CD Pipeline

on:
  # Run CI on all PRs to main branch (this is the quality gate)
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: ./.github/actions/install-uv

    - name: Install dependencies
      run: make install-test

    - name: Run unit tests
      run: make test

    - name: Run unit test coverage
      run: make test-cov
      continue-on-error: true

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.14"

    - name: Install uv
      uses: ./.github/actions/install-uv

    - name: Install dependencies
      run: make install-dev

    - name: Run quality checks
      run: make ci-quality

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.14"

    - name: Install uv
      uses: ./.github/actions/install-uv

    - name: Install Node.js for lockfile audit
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"

    - name: Install dependencies
      run: make install-dev

    - name: Run security scan
      run: make ci-security

    - name: Upload Bandit report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: bandit-report
        path: bandit-report.json

  container:
    name: Container Build
    runs-on: ubuntu-latest
    # Build container for all events (PRs and pushes)
    # This ensures Docker builds are tested before merging

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build container image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: false
        load: true
        tags: mcp-redfish:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test container image
      run: |
        docker run --rm --entrypoint="" mcp-redfish:test python --version

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [test, code-quality]
    # E2E tests include MCP server startup, inspector integration, and real Redfish testing

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.14"

    - name: Install uv
      uses: ./.github/actions/install-uv

    - name: Install Node.js for MCP Inspector
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y curl jq openssl

    - name: Run e2e tests with emulator
      run: |
        echo "## E2E tests" >> "$GITHUB_STEP_SUMMARY"
        echo "Default job remains **stdio** + Inspector + Redfish emulator." >> "$GITHUB_STEP_SUMMARY"
        echo "This suite also runs HTTP MCP auth e2e: unauthenticated lab mode, local JWT Bearer, local HTTPS introspection hardening, OAuth Proxy and OIDC Proxy against CNCF Dex, OIDC Proxy metadata against a loopback OpenID simulator, and strict Host/Origin middleware. Cloud IdPs are not in CI." >> "$GITHUB_STEP_SUMMARY"
        make e2e

    - name: Check emulator logs on failure
      if: failure()
      run: |
        echo "=== Emulator Logs ==="
        make e2e-emulator-logs || echo "No logs available"
        echo "=== Dex Logs ==="
        make e2e-dex-logs || echo "No Dex logs available"

    - name: Cleanup e2e environment
      if: always()
      run: |
        make e2e-emulator-stop || true
        make e2e-dex-stop || true
